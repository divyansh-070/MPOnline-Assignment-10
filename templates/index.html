<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Heart Disease Risk Predictor</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #ef4444;
    --accent-safe: #22c55e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px 64px;
  }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 0.9rem; }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 0.8rem; color: var(--muted); }
  input, select {
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  button {
    grid-column: 1 / -1;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    display: none;
    font-size: 0.95rem;
  }
  #result.disease { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent); }
  #result.safe { background: rgba(34, 197, 94, 0.15); border: 1px solid var(--accent-safe); }
  #result.error { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--accent); }
  #result strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
  footer { margin-top: 24px; color: var(--muted); font-size: 0.75rem; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <h1>Heart Disease Risk Predictor</h1>
  <p class="subtitle">Enter patient clinical parameters and submit to get a prediction from the trained model. This is an educational demo, not a medical diagnosis tool.</p>

  <form id="predict-form">
    <div class="field">
      <label for="age">Age (years)</label>
      <input type="number" id="age" name="age" required value="55">
    </div>
    <div class="field">
      <label for="sex">Sex</label>
      <select id="sex" name="sex" required>
        <option value="1">Male</option>
        <option value="0">Female</option>
      </select>
    </div>
    <div class="field">
      <label for="cp">Chest Pain Type (0-3)</label>
      <input type="number" id="cp" name="cp" min="0" max="3" required value="0">
    </div>
    <div class="field">
      <label for="trestbps">Resting Blood Pressure (mm Hg)</label>
      <input type="number" id="trestbps" name="trestbps" required value="130">
    </div>
    <div class="field">
      <label for="chol">Serum Cholesterol (mg/dl)</label>
      <input type="number" id="chol" name="chol" required value="250">
    </div>
    <div class="field">
      <label for="fbs">Fasting Blood Sugar &gt; 120 mg/dl</label>
      <select id="fbs" name="fbs" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>
    </div>
    <div class="field">
      <label for="restecg">Resting ECG Result (0-2)</label>
      <input type="number" id="restecg" name="restecg" min="0" max="2" required value="1">
    </div>
    <div class="field">
      <label for="thalach">Max Heart Rate Achieved</label>
      <input type="number" id="thalach" name="thalach" required value="150">
    </div>
    <div class="field">
      <label for="exang">Exercise-Induced Angina</label>
      <select id="exang" name="exang" required>
        <option value="0">No</option>
        <option value="1">Yes</option>
      </select>
    </div>
    <div class="field">
      <label for="oldpeak">ST Depression (oldpeak)</label>
      <input type="number" step="0.1" id="oldpeak" name="oldpeak" required value="1.0">
    </div>
    <div class="field">
      <label for="slope">Slope of Peak Exercise ST (0-2)</label>
      <input type="number" id="slope" name="slope" min="0" max="2" required value="1">
    </div>
    <div class="field">
      <label for="ca">Major Vessels Colored (0-4)</label>
      <input type="number" id="ca" name="ca" min="0" max="4" required value="0">
    </div>
    <div class="field">
      <label for="thal">Thalassemia (0-3)</label>
      <input type="number" id="thal" name="thal" min="0" max="3" required value="2">
    </div>

    <button type="submit" id="submit-btn">Predict Risk</button>
  </form>

  <div id="result"></div>

  <footer>Served by the Flask API at <code>/predict</code> · Model: Random Forest Classifier</footer>
</div>

<script>
const form = document.getElementById("predict-form");
const resultBox = document.getElementById("result");
const submitBtn = document.getElementById("submit-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const formData = new FormData(form);
  const payload = {};
  for (const [key, value] of formData.entries()) {
    payload[key] = Number(value);
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Predicting...";
  resultBox.style.display = "none";

  try {
    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    resultBox.style.display = "block";

    if (!res.ok) {
      resultBox.className = "error";
      resultBox.innerHTML = `<strong>Error</strong>${data.error || "Something went wrong."}`;
    } else {
      const isDisease = data.prediction_label === 1;
      resultBox.className = isDisease ? "disease" : "safe";
      let html = `<strong>${data.prediction}</strong>`;
      if (data.probability) {
        html += `Confidence — No Disease: ${(data.probability.no_disease * 100).toFixed(1)}% | Disease: ${(data.probability.disease * 100).toFixed(1)}%`;
      }
      resultBox.innerHTML = html;
    }
  } catch (err) {
    resultBox.style.display = "block";
    resultBox.className = "error";
    resultBox.innerHTML = `<strong>Request failed</strong>${err.message}`;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Predict Risk";
  }
});
</script>
</body>
</html>
